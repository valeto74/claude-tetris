<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Tetris</title>
  <link rel="stylesheet" href="style.css" />
</head>
<body>
  <div class="wrapper">
    <h1 class="game-title">TETRIS</h1>
    <div class="game-container">
      <canvas id="board" width="300" height="600"></canvas>

      <aside class="panel">
        <div class="panel-section">
          <span class="label">SCORE</span>
          <span class="value" id="score">0</span>
        </div>
        <div class="panel-section">
          <span class="label">LINES</span>
          <span class="value" id="lines">0</span>
        </div>
        <div class="panel-section">
          <span class="label">LEVEL</span>
          <span class="value" id="level">1</span>
        </div>

        <div class="panel-section">
          <span class="label">NEXT</span>
          <canvas id="next-canvas" width="120" height="120"></canvas>
        </div>

        <div class="panel-section controls">
          <span class="label">CONTROLS</span>
          <ul>
            <li><kbd>←</kbd><kbd>→</kbd> mover</li>
            <li><kbd>↑</kbd> rotar</li>
            <li><kbd>↓</kbd> bajar</li>
            <li><kbd>Space</kbd> caída</li>
            <li><kbd>P</kbd> pausa</li>
          </ul>
        </div>
      </aside>
    </div>

    <div id="overlay" class="overlay hidden">
      <div class="overlay-box">
        <p id="overlay-title">GAME OVER</p>
        <p id="overlay-score"></p>
        <div id="highscore-entry" class="highscore-entry hidden">
          <input type="text" id="player-name-input" class="hs-input" maxlength="12" value="Jugador" />
          <button id="save-score-btn">Guardar</button>
        </div>
        <table class="hs-table">
          <thead>
            <tr><th>#</th><th>Nombre</th><th>Puntos</th><th>Líneas</th><th>Nivel</th><th>Combo</th></tr>
          </thead>
          <tbody id="hs-tbody-gameover"></tbody>
        </table>
        <button id="restart-btn">Reiniciar</button>
      </div>
    </div>

    <div id="start-screen" class="start-screen">
      <div class="start-box">
        <h2 class="start-heading">RÉCORDS</h2>
        <div class="hs-summary">
          <div class="hs-summary-item">
            <span class="label">MEJOR COMBO</span>
            <span class="value" id="hs-best-combo">0</span>
          </div>
          <div class="hs-summary-item">
            <span class="label">MÁX. LÍNEAS</span>
            <span class="value" id="hs-best-lines">0</span>
          </div>
        </div>
        <table class="hs-table">
          <thead>
            <tr><th>#</th><th>Nombre</th><th>Puntos</th><th>Líneas</th><th>Nivel</th><th>Combo</th></tr>
          </thead>
          <tbody id="hs-tbody-start"></tbody>
        </table>
        <button id="play-btn">Jugar</button>
        <button id="reset-scores-btn" class="secondary-btn">Resetear récords</button>
      </div>
    </div>
  </div>

  <script src="game.js"></script>
</body>
</html>
